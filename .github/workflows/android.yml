name: Android

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/android.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/android.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Build debug APK
        run: npm run android:build -- --debug --target aarch64

      - name: Build release APK
        run: npm run android:build -- --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: pawchive-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/arm64/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          retention-days: 14
