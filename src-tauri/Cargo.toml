[package]
name = "pawchive-client"
version = "1.0.4"
description = "A native desktop and mobile client for the Pawchive archive"
authors = ["Pawchive Client Contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/tplw/Pawchive-Client"
homepage = "https://github.com/tplw/Pawchive-Client"

[lib]
name = "pawchive_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "cookies",
  "rustls-tls",
  "gzip",
  "brotli",
  "http2",
  "charset",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
rusqlite = { version = "0.41.1", features = ["bundled"] }
url = "2.5.8"
ammonia = "4.2.4"
chrono = { version = "0.4.45", features = ["serde"] }
semver = "1.0"
regex = "1.12.2"
imagesize = "0.15.0"
sha2 = "0.10.9"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3.23.0"

[features]
# This feature is used for production builds where `devUrl` points to the
# filesystem instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
