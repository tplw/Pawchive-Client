<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: http: data: blob:; media-src 'self' https: blob: http:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost https: http:; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Pawchive Desktop</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #17191a;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #17191a;
      }

      #boot-splash img {
        width: 160px;
        height: 160px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading Pawchive">
        <img src="/paw-logo.png" alt="" width="160" height="160" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
